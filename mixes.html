<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mix — DJ Carlos</title>
  <meta name="description" content="Ascolta i mix di DJ Carlos.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Monoton&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0D0D0D;
      --violet: #8B5CF6;
      --pink: #EC4899;
      --text: #F5F3FF;
      --muted: #A1A1AA;
      --card: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.08);
      --radius: 18px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; }

    /* ---------- Sfondo animato ---------- */
    .bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      background: var(--bg);
    }

    .bg::before {
      content: "";
      position: absolute;
      inset: -50%;
      background:
        radial-gradient(circle at 30% 30%, rgba(139, 92, 246, 0.35), transparent 40%),
        radial-gradient(circle at 70% 60%, rgba(236, 72, 153, 0.30), transparent 40%),
        radial-gradient(circle at 50% 90%, rgba(139, 92, 246, 0.20), transparent 45%);
      filter: blur(60px);
      animation: drift 18s ease-in-out infinite alternate;
    }

    .bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, rgba(139, 92, 246, 0.12), rgba(236, 72, 153, 0.12), rgba(139, 92, 246, 0.12));
      background-size: 300% 300%;
      animation: shift 12s ease infinite;
    }

    @keyframes drift {
      0%   { transform: translate(0, 0) rotate(0deg) scale(1); }
      50%  { transform: translate(5%, -4%) rotate(20deg) scale(1.1); }
      100% { transform: translate(-5%, 4%) rotate(-15deg) scale(1); }
    }

    @keyframes shift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ---------- Navigazione ---------- */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Lo sfondo sfocato sta su ::before: un backdrop-filter sull'header
       lo renderebbe il riferimento del menu mobile (position: fixed),
       che coprirebbe solo l'header invece di tutto lo schermo */
    header::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      border-bottom: 1px solid transparent;
      transition: background 0.3s, backdrop-filter 0.3s, border-color 0.3s;
    }

    header.scrolled::before {
      background: rgba(13, 13, 13, 0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom-color: var(--card-border);
    }

    .logo {
      font-weight: 800;
      letter-spacing: 0.15em;
      font-size: 1.05rem;
    }

    .logo span {
      background: linear-gradient(90deg, var(--violet), var(--pink));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 36px;
    }

    nav a {
      position: relative;
      font-weight: 400;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      transition: color 0.25s;
    }

    nav a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -6px;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--violet), var(--pink));
      box-shadow: 0 0 8px var(--pink);
      transition: width 0.3s;
    }

    nav a:hover,
    nav a.active { color: var(--text); }

    nav a:hover::after,
    nav a.active::after { width: 100%; }

    .menu-toggle {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      width: 32px;
      height: 24px;
      position: relative;
      z-index: 110;
    }

    .menu-toggle span {
      position: absolute;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--text);
      border-radius: 2px;
      transition: transform 0.3s, opacity 0.3s, top 0.3s;
    }

    .menu-toggle span:nth-child(1) { top: 2px; }
    .menu-toggle span:nth-child(2) { top: 11px; }
    .menu-toggle span:nth-child(3) { top: 20px; }

    .menu-toggle[aria-expanded="true"] span:nth-child(1) { top: 11px; transform: rotate(45deg); }
    .menu-toggle[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
    .menu-toggle[aria-expanded="true"] span:nth-child(3) { top: 11px; transform: rotate(-45deg); }

    /* ---------- Intestazione pagina ---------- */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 130px 24px 80px;
    }

    .page-head {
      text-align: center;
      margin-bottom: 48px;
    }

    .eyebrow {
      font-size: 0.8rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .neon {
      font-family: 'Monoton', cursive;
      font-weight: 400;
      font-size: clamp(2.6rem, 9vw, 5.5rem);
      line-height: 1.1;
      letter-spacing: 0.04em;
      color: #FDF4FF;
      text-shadow:
        0 0 4px #fff,
        0 0 10px #fff,
        0 0 20px var(--pink),
        0 0 40px var(--pink),
        0 0 70px var(--violet),
        0 0 100px var(--violet);
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 760px) {
      .menu-toggle { display: block; }

      nav {
        position: fixed;
        inset: 0;
        background: rgba(13, 13, 13, 0.96);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
      }

      nav.open {
        opacity: 1;
        pointer-events: auto;
      }

      nav ul {
        flex-direction: column;
        align-items: center;
        gap: 34px;
      }

      nav a {
        font-size: 1.6rem;
        color: var(--text);
      }

      main { padding: 110px 16px 60px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
      html { scroll-behavior: auto; }
    }
  </style>
  <link rel="stylesheet" href="player.css">
  <link rel="stylesheet" href="footer.css">
  <link rel="stylesheet" href="effects.css">
  <script src="effects.js"></script>
</head>
<body>

    <a href="index.html" class="logo">DJ <span>CARLOS</span></a>

      <span></span><span></span><span></span>
    </button>
    <nav id="main-nav" aria-label="Navigazione principale">
      <ul>

  <main>

    <div id="player-slot" data-reveal></div>
  </main>

    </div>
  </footer>

  <script src="player.js"></script>
  <script type="module">
    const signal = window.pageSignal;

    // Header allo scroll
    const header = document.getElementById("header");
    window.addEventListener("scroll", () => {
      header.classList.toggle("scrolled", window.scrollY > 30);
    }, { passive: true, signal });

    // Menu mobile
    const menuBtn = document.querySelector(".menu-toggle");
    const nav = document.getElementById("main-nav");
    menuBtn.addEventListener("click", () => {
      const open = menuBtn.getAttribute("aria-expanded") === "true";
      menuBtn.setAttribute("aria-expanded", String(!open));
      menuBtn.setAttribute("aria-label", open ? "Apri menu" : "Chiudi menu");
      nav.classList.toggle("open", !open);
      document.body.style.overflow = open ? "" : "hidden";
    });

    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
